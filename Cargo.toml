[package]
name = "claude-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Run Claude Code under multiple accounts at once — each as its own command, with its own credential, never conflicting."
license = "MIT"
repository = "https://github.com/ohmaseclaro/claude-proxy"
readme = "README.md"
keywords = ["claude", "claude-code", "cli", "oauth", "accounts"]
categories = ["command-line-utilities"]

[[bin]]
name = "claude-proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the OAuth exchange and the quota listing: a CLI wants one
# synchronous call, not an async runtime. ureq is tiny and brings rustls, so
# there is no system OpenSSL.
ureq = { version = "2", features = ["json"] }
# PKCE for the login flow: SHA-256 for the S256 code challenge, and a secure
# RNG for the verifier/state. These let us run `claude setup-token`'s own OAuth
# flow ourselves so the long-lived token is obtained directly and never printed.
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
# Temp dirs for the hermetic store/registry/install tests.
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
