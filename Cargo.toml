[package]
name = "claude-proxy"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "Run Claude Code under multiple accounts at once — each as its own command, with its own credential, never conflicting."
license = "MIT"
repository = "https://github.com/ohmaseclaro/claude-proxy"
readme = "README.md"
keywords = ["claude", "claude-code", "cli", "oauth", "accounts"]
categories = ["command-line-utilities"]

[[bin]]
name = "claude-proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the quota lookup: a CLI wants a few synchronous calls, not an
# async runtime. ureq brings rustls, so there is no system OpenSSL.
ureq = { version = "2", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Temp dirs for the hermetic registry/install tests.
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
