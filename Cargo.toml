[package]
name = "claude-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Run Claude Code under multiple accounts at once — each as its own command, with its own credential, never conflicting."
license = "MIT"
repository = "https://github.com/ohmaseclaro/claude-proxy"
readme = "README.md"
keywords = ["claude", "claude-code", "cli", "oauth", "accounts"]
categories = ["command-line-utilities"]

[[bin]]
name = "claude-proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Temp dirs for the hermetic registry/install tests.
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
